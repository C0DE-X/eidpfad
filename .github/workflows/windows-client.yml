name: Windows client

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  export:
    name: Export Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download verified Godot editor and export templates
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content .godot-version -Raw).Trim()
          $releaseUrl = "https://github.com/godotengine/godot-builds/releases/download/$version-stable"
          $editorArchive = "Godot_v$version-stable_win64.exe.zip"
          $templatesArchive = "Godot_v$version-stable_export_templates.tpz"

          curl.exe --fail --location --retry 3 --output $editorArchive "$releaseUrl/$editorArchive"
          curl.exe --fail --location --retry 3 --output $templatesArchive "$releaseUrl/$templatesArchive"
          curl.exe --fail --location --retry 3 --output SHA512-SUMS.txt "$releaseUrl/SHA512-SUMS.txt"

          function Assert-Checksum([string]$Path) {
              $line = Get-Content SHA512-SUMS.txt | Where-Object { $_ -match "[ *]$([regex]::Escape($Path))$" } | Select-Object -First 1
              if (-not $line) {
                  throw "No SHA-512 checksum found for $Path"
              }
              $expected = ($line -split "\s+")[0]
              $actual = (Get-FileHash -Algorithm SHA512 -Path $Path).Hash
              if ($actual -ne $expected) {
                  throw "SHA-512 checksum mismatch for $Path"
              }
          }

          Assert-Checksum $editorArchive
          Assert-Checksum $templatesArchive

          Expand-Archive -Path $editorArchive -DestinationPath .godot-ci -Force
          Copy-Item $templatesArchive .godot-templates.zip
          Expand-Archive -Path .godot-templates.zip -DestinationPath .godot-templates -Force

          $templateDirectory = Join-Path $env:APPDATA "Godot\export_templates\$version.stable"
          New-Item -ItemType Directory -Force -Path $templateDirectory | Out-Null
          Copy-Item ".godot-templates\templates\*" $templateDirectory -Recurse -Force

          $editor = (Resolve-Path ".godot-ci\Godot_v$version-stable_win64.exe").Path
          "editor=$editor" >> $env:GITHUB_OUTPUT

      - name: Export release client
        shell: pwsh
        run: .\client\build-windows.ps1 -Godot "${{ steps.godot.outputs.editor }}" -Configuration release

      - name: Upload Windows client
        uses: actions/upload-artifact@v7
        with:
          name: eidpfad-windows-x86_64
          path: dist/client/eidpfad-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
