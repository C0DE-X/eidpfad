name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source without hydrating LFS assets
        uses: actions/checkout@v7

      - name: Check Git blobs and LFS pointers
        run: python3 scripts/check_repository.py

  validate:
    name: Rules and asset references
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install server test dependencies
        run: python -m pip install -e './server[dev]'

      - name: Run server tests and content validation
        run: make validate PYTHON=python

  godot-import:
    name: Godot import and GDScript parse
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source and LFS assets
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Download verified Godot editor
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .godot-version)"
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${version}-stable"
          curl --fail --location --retry 3 --output "${archive}" "${release_url}/${archive}"
          curl --fail --location --retry 3 --output SHA512-SUMS.txt "${release_url}/SHA512-SUMS.txt"
          grep -F "${archive}" SHA512-SUMS.txt > SHA512-CHECK.txt
          sha512sum --check SHA512-CHECK.txt
          unzip -q "${archive}" -d .godot-ci
          chmod +x ".godot-ci/Godot_v${version}-stable_linux.x86_64"

      - name: Import project and reject parser errors
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < .godot-version)"
          godot=".godot-ci/Godot_v${version}-stable_linux.x86_64"
          timeout 20m "${godot}" --headless --path client --import 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" godot-import.log; then
            echo "Godot reported a GDScript parser or load error."
            exit 1
          fi

  docker-build:
    name: Server container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config --quiet

      - name: Build production server image
        run: docker build --file server/Dockerfile --tag eidpfad-server:ci .
